name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC) and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Check tag matches package.json version
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - name: Update npm (trusted publishing needs npm >= 11.5.1)
        run: npm install -g npm@latest
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Staged publishing: the version waits on npm until a maintainer approves it with 2FA.
      - name: Stage for publishing (skipped if this version is already on npm)
        run: |
          if npm view "$(node -p "require('./package.json').name")@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then
            echo "::notice::${GITHUB_REF_NAME#v} is already on npm, nothing to stage."
          else
            npm stage publish
            echo "::notice::Staged. Approve it with: npm stage list expo-env-doctor, then npm stage approve <id>"
          fi
